[package]
name = "imanlib"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "Bounded local IPC protocol and client for iman and IGUI"

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"

tempfile = "=3.24.0"
