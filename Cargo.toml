[package]
name = "imanlib"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "Local IPC, display and input primitives for iman and IGUI"

[features]
graphics = ["dep:embedded-graphics"]
input = ["graphics", "dep:hidparser"]
drm = ["graphics", "dep:drm"]
drm-diagnostics = ["drm"]
rgb565 = []

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"
tempfile = "=3.24.0"
embedded-graphics = { version = "=0.8.2", optional = true }
hidparser = { version = "=1.0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "=0.14.1", optional = true }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }
